      - name: Test and initialize without old-news flood
        shell: bash
        run: |
          set -euo pipefail
          test -s app-config.json
          python3 -B .github/scripts/test_sync_announcements.py
          python3 -B .github/scripts/sync_announcements.py
          python3 -m json.tool app-config.json >/dev/null

      - name: Persist automation and remove this installer
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/scripts/sync_announcements.py \
            .github/scripts/test_sync_announcements.py \
            .github/workflows/sync-auto-announcements.yml \
            app-config.json \
            .automation/announcement-state.json

          installer_path=".github/workflows/install-auto-announcements-v2.yml"
          test -f "$installer_path"
          git rm -- "$installer_path"

          git commit -m "Install automatic announcements v2 and remove installer"
          git push origin HEAD:main
