name: ZZ - Stage Production Media Catalog 0.5.0

on:
  push:
    branches:
      - production-remote-promotion-0.5.0
    paths:
      - .github/workflows/tmp-stage-media-catalog-0.5.0.yml

permissions:
  contents: write

jobs:
  stage-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remote promotion branch
        uses: actions/checkout@v7
        with:
          ref: production-remote-promotion-0.5.0

      - name: Copy validated Test media catalog only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/fixi82896-gif/Alefatemion_remote_test/main/media-catalog.json \
            --output media-catalog.json
          test -s media-catalog.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('media-catalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(data, dict):
              raise SystemExit('media-catalog.json root must be an object')
          if int(data.get('schema_version', 0)) < 1:
              raise SystemExit('invalid media catalog schema_version')
          if p.stat().st_size > 8 * 1024 * 1024:
              raise SystemExit('media catalog exceeds app limit')
          print('Validated media catalog bytes:', p.stat().st_size)
          PY

      - name: Commit staged production media catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Fixit Production Remote Promotion"
          git config user.email "actions@users.noreply.github.com"
          git add media-catalog.json
          git diff --cached --check
          git commit -m "Stage validated media catalog for Production 0.5.0"
          git push origin HEAD:production-remote-promotion-0.5.0
