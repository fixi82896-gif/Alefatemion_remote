      - name: Test and initialize with safe provider fallback
        shell: bash
        run: |
          set -euo pipefail

          python3 -B .github/scripts/test_sync_announcements.py
          python3 -B .github/scripts/sync_announcements.py
          python3 -m json.tool app-config.json >/dev/null
          python3 -m json.tool .automation/announcement-state.json >/dev/null

          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(
              Path(".automation/announcement-state.json")
              .read_text(encoding="utf-8")
          )
          assert state.get("schema_version") == 3
          assert state.get("initialized") is True
          assert isinstance(state.get("album_initialized"), bool)
          print(
              "Album baseline initialized:",
              state["album_initialized"],
          )
          PY

      - name: Persist automation and remove temporary installers
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/scripts/sync_announcements.py \
            .github/scripts/test_sync_announcements.py \
            .github/workflows/sync-auto-announcements.yml \
            app-config.json \
            .automation/announcement-state.json

          current_installer=".github/workflows/install-auto-announcements-v2.1-resilient.yml"
          test -f "$current_installer"

          git rm --ignore-unmatch -- \
            "$current_installer" \
            .github/workflows/install-auto-announcements-v2.yml \
            .github/workflows/.gitkeep \
            install-auto-announcements-v2.yml

          if git diff --cached --quiet; then
            echo "::error::No verified installation changes were staged"
            exit 1
          fi

          git commit -m "Install resilient automatic announcements"
          git push origin HEAD:main

