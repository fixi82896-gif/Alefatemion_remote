name: Install Automatic Announcements v2.1 Resilient (Self Cleaning)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-automatic-announcements-v2-1-resilient
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Alefatemion remote config
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify correct repository
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "fixi82896-gif/Alefatemion_remote" ]]; then
            echo "::error::This installer belongs only in fixi82896-gif/Alefatemion_remote"
            exit 1
          fi

          test -s app-config.json

