          python3 -B "$ANNOUNCEMENT_ENGINE_DIR/sync_announcements.py"
          python3 -m json.tool app-config.json >/dev/null
          python3 -m json.tool .automation/announcement-state.json >/dev/null

          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(
              Path(".automation/announcement-state.json")
              .read_text(encoding="utf-8")
          )
          assert state.get("schema_version") == 3
          assert state.get("initialized") is True
          assert isinstance(state.get("album_initialized"), bool)
          print(
              "Album baseline initialized:",
              state["album_initialized"],
          )
          PY

      - name: Commit announcement or baseline changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- app-config.json .automation/announcement-state.json)" ]]; then
            echo "No announcement or baseline change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-config.json .automation/announcement-state.json
          git commit -m "Sync automatic announcements"
          git push origin HEAD:main

