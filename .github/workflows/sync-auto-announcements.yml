name: Sync automatic announcements (Permanent)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app-config.json
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-automatic-announcements-permanent
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Alefatemion remote config
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2

      - name: Verify correct repository and config
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "fixi82896-gif/Alefatemion_remote" ]]; then
            echo "::error::This permanent workflow belongs only in fixi82896-gif/Alefatemion_remote"
            exit 1
          fi

          test -s app-config.json
          python3 -m json.tool app-config.json >/dev/null

      - name: Prepare verified announcement engine
        shell: bash
        run: |
          set -euo pipefail

          engine_dir="$RUNNER_TEMP/announcement-engine"
          mkdir -p "$engine_dir"

