name: ZZ - Publish Approved Production OTA Code 16

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-publish-production-ota-code16.yml

permissions:
  contents: write

concurrency:
  group: publish-approved-production-ota-code16
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA256: c90863702c957468a3331d9348caf57c5192c710c9d35090309c468af18c37cb
      EXPECTED_SIZE: "5254977"
      RELEASE_TAG: android-v16
      RELEASE_ASSET: Alefatemion-16.apk
      RELEASE_URL: https://github.com/fixi82896-gif/Alefatemion_remote/releases/download/android-v16/Alefatemion-16.apk
      SOURCE_URL: 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-00f8-820d-9bb5-361912fad696/raw?se=2026-09-09T12%3A44%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=61f782ff-5fc9-59b7-8c70-b61b3219ec40&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T03%3A20%3A32Z&ske=2026-09-10T03%3A20%3A32Z&sks=b&skv=2026-02-06&sig=rK5XV3BUteYVYT/T8AqswM4S7JNyp84b00u8Xpd2xcA%3D'

    steps:
      - name: Download and verify exact approved code 16 APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/Alefatemion-16.apk"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 "$SOURCE_URL" -o "$apk"
          test -s "$apk"
          test "$(stat -c '%s' "$apk")" = "$EXPECTED_SIZE"
          test "$(sha256sum "$apk" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -t "$apk" >/dev/null

      - name: Create release if needed and upload exact asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          status="$(curl --silent --output "$RUNNER_TEMP/release.json" --write-out '%{http_code}' "${auth[@]}" "$api/releases/tags/$RELEASE_TAG")"
          if [[ "$status" == "404" ]]; then
            create_body="$(jq -nc '{tag_name:"android-v16",target_commitish:"main",name:"آل فاطمیون 0.5.0",body:"نسخه جدید ۰.۵.۰ آل فاطمیون منتشر شد. لطفاً برای دریافت اصلاحات و امکانات جدید، برنامه را بروزرسانی کنید.",draft:false,prerelease:false}')"
            curl --fail --silent --show-error -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              --data "$create_body" "$api/releases" > "$RUNNER_TEMP/release.json"
          elif [[ "$status" != "200" ]]; then
            cat "$RUNNER_TEMP/release.json" >&2 || true
            exit 1
          fi

          release_id="$(jq -r '.id' "$RUNNER_TEMP/release.json")"
          test "$release_id" != "null"
          existing_id="$(jq -r --arg n "$RELEASE_ASSET" '.assets[]? | select(.name == $n) | .id' "$RUNNER_TEMP/release.json" | head -n1)"
          existing_digest="$(jq -r --arg n "$RELEASE_ASSET" '.assets[]? | select(.name == $n) | (.digest // "")' "$RUNNER_TEMP/release.json" | head -n1)"

          if [[ "$existing_digest" != "sha256:$EXPECTED_SHA256" ]]; then
            if [[ -n "$existing_id" && "$existing_id" != "null" ]]; then
              curl --fail --silent --show-error -X DELETE "${auth[@]}" "$api/releases/assets/$existing_id"
            fi
            upload="$(curl --fail --silent --show-error -X POST "${auth[@]}" \
              -H 'Content-Type: application/vnd.android.package-archive' \
              --data-binary @"$RUNNER_TEMP/Alefatemion-16.apk" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${RELEASE_ASSET}")"
            test "$(jq -r '.browser_download_url' <<<"$upload")" = "$RELEASE_URL"
          fi

          verify="$(curl --fail --silent --show-error "${auth[@]}" "$api/releases/tags/$RELEASE_TAG")"
          test "$(jq -r --arg n "$RELEASE_ASSET" '.assets[]? | select(.name == $n) | (.digest // "")' <<<"$verify" | head -n1)" = "sha256:$EXPECTED_SHA256"
          test "$(jq -r --arg n "$RELEASE_ASSET" '.assets[]? | select(.name == $n) | .size' <<<"$verify" | head -n1)" = "$EXPECTED_SIZE"

      - name: Publish code 16 OTA metadata safely
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, time, urllib.request, urllib.error
          from datetime import datetime, timezone

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected_sha = os.environ['EXPECTED_SHA256']
          release_url = os.environ['RELEASE_URL']
          api = f'https://api.github.com/repos/{repo}/contents/app-config.json'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode()
                  return resp.status, json.loads(body) if body else {}

          for attempt in range(5):
              _, current = request(api + '?ref=main')
              config = json.loads(base64.b64decode(current['content']).decode('utf-8'))
              ota = dict(config.get('ota') or {})
              current_code = int(ota.get('version_code') or 0)
              if current_code > 16:
                  raise SystemExit(f'Newer OTA code {current_code} already exists; refusing to overwrite it.')

              config['revision'] = int(config.get('revision') or 0) + 1
              ota.update({
                  'version_code': 16,
                  'version_name': '0.5.0',
                  'apk_url': release_url,
                  'sha256': expected_sha,
                  'published_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
                  'message': 'نسخه جدید ۰.۵.۰ آل فاطمیون منتشر شد. لطفاً برای دریافت اصلاحات و امکانات جدید، برنامه را بروزرسانی کنید.',
              })
              ota.setdefault('min_supported_version_code', 0)
              ota.setdefault('mandatory', False)
              config['ota'] = ota
              encoded = base64.b64encode((json.dumps(config, ensure_ascii=False, indent=2) + '\n').encode()).decode()
              payload = {'message':'Publish Production OTA 0.5.0 code 16','content':encoded,'sha':current['sha'],'branch':'main'}
              try:
                  request(api, 'PUT', payload)
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422) or attempt == 4:
                      raise
                  time.sleep(2)
          PY

      - name: Verify public code 16 OTA state
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/app-config.json" \
            -o "$RUNNER_TEMP/app-config.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'app-config.json'), encoding='utf-8') as f:
              c = json.load(f)
          ota = c['ota']
          assert ota['version_code'] == 16
          assert ota['version_name'] == '0.5.0'
          assert ota['apk_url'] == os.environ['RELEASE_URL']
          assert ota['sha256'] == os.environ['EXPECTED_SHA256']
          PY

      - name: Remove temporary publisher
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/tmp-publish-production-ota-code16.yml"
          current="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api?ref=main")"
          sha="$(jq -r '.sha' <<<"$current")"
          body="$(jq -nc --arg sha "$sha" '{message:"Remove temporary Production code 16 publisher", sha:$sha, branch:"main"}')"
          curl --fail --silent --show-error -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' --data "$body" "$api" >/dev/null
