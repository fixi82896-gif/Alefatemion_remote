          python3 -m json.tool app-config.json >/dev/null
          python3 -m py_compile \
            .github/scripts/sync_announcements.py \
            .github/scripts/test_sync_announcements.py
          python3 -B .github/scripts/test_sync_announcements.py
          grep -Fq 'prune_stale_automatic_items' .github/scripts/sync_announcements.py
          grep -Fq 'cancel-in-progress: true' .github/workflows/sync-auto-announcements.yml
          if grep -Eq '^  push:' .github/workflows/sync-auto-announcements.yml; then
            echo 'The synchronization workflow must not trigger itself on app-config pushes.' >&2
            exit 1
          fi
          git diff --check

      - name: Persist files and remove installer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/scripts/sync_announcements.py \
            .github/scripts/test_sync_announcements.py \
            .github/workflows/sync-auto-announcements.yml
          git rm --ignore-unmatch \
            .github/workflows/install-fix-announcement-sync-v2.yml

          if git diff --cached --quiet; then
            echo 'Stable announcement synchronization is already installed.'
            exit 0
          fi
          git commit -m 'Stabilize automatic announcement synchronization'
          git push origin HEAD:main
